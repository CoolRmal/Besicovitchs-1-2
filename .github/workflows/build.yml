name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure Lean and restore the Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: true

      - name: Build the project and challenge
        run: lake build Besicovitch Challenge Solution

      - name: Check source hygiene
        shell: bash
        run: |
          if grep -REn --include='*.lean' --exclude-dir='.lake' \
              '(^|[^[:alnum:]_])admit([^[:alnum:]_]|$)|native_decide|Lean\.ofReduceBool|^[[:space:]]*axiom([^[:alnum:]_]|$)' \
              .; then
            exit 1
          fi
          while IFS= read -r file; do
            lines=$(wc -l < "$file")
            if (( lines > 1500 )); then
              echo "$file has $lines lines"
              exit 1
            fi
            if awk 'length($0) > 100 { exit 1 }' "$file"; then
              :
            else
              echo "$file has a line longer than 100 characters"
              exit 1
            fi
          done < <(find . -path './.lake' -prune -o -name '*.lean' -print)

  comparator:
    # A fresh runner: the comparator must build the solution itself, inside its sandbox, without
    # reusing any artifact compiled from Solution.lean.
    runs-on: ubuntu-latest
    env:
      LANDRUN_REV: f59e83dbb4fd0af584dec5091168d0b35c8410b7
      LEAN4EXPORT_REV: 4e7915201d3f9f04470d9eae002fa695f7cdc589 # v4.32.0
      COMPARATOR_REV: 07bc4ea40f2266dcb861820a2ec1fa3244ed307f # toolchain v4.32.0
      # Upstream fix, later than the v4.32.0 toolchain: pass `--` to landrun before the sandboxed
      # command, so that the `--` in the lean4export arguments reaches lean4export.
      COMPARATOR_SEPARATOR_FIX: 9badaf470d8f724346d33738bd273efacd78df76
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure Lean and restore the Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Build landrun, lean4export and the comparator
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools/bin"
          git clone --quiet https://github.com/Zouuup/landrun.git "$tools/landrun"
          git -C "$tools/landrun" checkout --quiet --detach "$LANDRUN_REV"
          (cd "$tools/landrun" && go build -o "$tools/bin/landrun" ./cmd/landrun)
          git clone --quiet https://github.com/leanprover/lean4export.git "$tools/lean4export"
          git -C "$tools/lean4export" checkout --quiet --detach "$LEAN4EXPORT_REV"
          (cd "$tools/lean4export" && lake build lean4export)
          cp "$tools/lean4export/.lake/build/bin/lean4export" "$tools/bin/"
          git clone --quiet https://github.com/leanprover/comparator.git "$tools/comparator"
          git -C "$tools/comparator" checkout --quiet --detach "$COMPARATOR_REV"
          git -C "$tools/comparator" cherry-pick --no-commit "$COMPARATOR_SEPARATOR_FIX"
          (cd "$tools/comparator" && lake build comparator)
          cp "$tools/comparator/.lake/build/bin/comparator" "$tools/bin/"
          echo "$tools/bin" >> "$GITHUB_PATH"

      - name: Run the comparator
        run: lake env comparator comparator.json
